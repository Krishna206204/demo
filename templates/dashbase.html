{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Jhime Malika Secondary School{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800">
    <!-- Navigation -->
    {% include "dashnav.html" %}

    <!-- Main Content -->
    <main class="w-full pt-16">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    {% include "footer.html" %}

    <!-- SweetAlert Messages -->
    {% if messages %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      {% for message in messages %}
          Swal.fire({
              icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",
              text: "{{ message|escapejs }}",
              showConfirmButton: false,
              timer: 2500
          });
      {% endfor %}
    </script>
    {% endif %} {% block extra_js %}{% endblock %}
  </body>
</html>
